      - name: Show errors in the run summary
        if: failure()
        working-directory: mod
        run: |
          touch build.log
          {
            echo '### Build failed - send a screenshot of this box'
            echo '```'
            grep -n -i -E 'what went wrong|error:|could not|not found|unsupported|failed|invalid|unexpected' build.log | head -n 40 || true
            echo '...'
            tail -n 25 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: show-lyrics-mobile-mod
          path: mod/dist/*.jar
          if-no-files-found: error

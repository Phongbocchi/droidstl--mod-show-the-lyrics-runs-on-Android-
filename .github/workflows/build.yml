name: Build Show Lyrics Mobile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Fabric mod (Minecraft 1.21.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'
      - name: Unpack sources and build
        shell: bash
        run: |
          set -eo pipefail
          # unpack the sources that are stored (compressed) at the very end of this step
          sed -n '/^#PAYLOAD$/,$p' "$0" | tail -n +2 | base64 -d | tar xz
          cd mod
          SRC=src/main/java/com/showlyricsmobile
          mkdir -p dist
          : > build.log
          : > errors.txt
          APIS="0.141.3 0.140.2 0.139.4"
          API=""
          cur_hud=basic; cur_view=none; cur_font=none; cur_ui=none

          # put the chosen variant of every optional module into the project
          apply() { # hud view font ui
            rm -f $SRC/Hud.java $SRC/Follow.java $SRC/View.java $SRC/Fonts.java $SRC/SettingsUi.java $SRC/SettingsScreen.java
            cp ../variants/hud/$1/*.java ../variants/view/$2/*.java ../variants/font/$3/*.java ../variants/ui/$4/*.java $SRC/
          }
          suffix() { # hud view font ui
            local s=flat
            [ "$1" = full ] && s=floating
            [ "$2" = camera ] && s="$s-thirdperson"
            [ "$3" = real ] && s="$s-fonts"
            [ "$4" = screen ] && s="$s-settings"
            echo "$s"
          }
          build_set() { # label hud view font ui
            local label="$1"; shift
            local sfx v
            apply "$@"
            sfx=$(suffix "$@")
            for v in ${API:-$APIS}; do
              echo "=== $label ($sfx) | fabric-api $v+1.21.11 ===" | tee -a build.log
              if gradle build --no-daemon --console=plain -Pfabric_version="$v+1.21.11" > attempt.log 2>&1; then
                cat attempt.log >> build.log
                API=$v
                rm -f dist/*.jar
                cp build/libs/showlyricsmobile-1.0.0.jar "dist/showlyricsmobile-1.21.11-$sfx.jar"
                cur_hud=$1; cur_view=$2; cur_font=$3; cur_ui=$4
                return 0
              fi
              cat attempt.log >> build.log
              if grep -q 'error: ' attempt.log; then
                # a code error: other Fabric API versions will not help
                { echo "[$label]"; grep -A2 'error: ' attempt.log | head -n 12; } >> errors.txt
                return 1
              fi
            done
            return 1
          }

          # 1) try with every feature on
          if ! build_set everything full camera real screen; then
            # 2) otherwise start from the plain version and add features one by one
            : > errors.txt
            if ! build_set base basic none none none; then
              {
                echo '### Build failed even for the plain version - send a screenshot of this box'
                echo '```'
                grep -n -i -E 'what went wrong|error:|could not|not found|unsupported|failed' build.log | head -n 30 || true
                tail -n 20 build.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            build_set floating full eye "$cur_font" "$cur_ui" || true
            if [ "$cur_hud" = full ]; then build_set thirdperson full camera "$cur_font" "$cur_ui" || true; fi
            build_set fonts "$cur_hud" "$cur_view" real "$cur_ui" || true
            build_set settings "$cur_hud" "$cur_view" "$cur_font" screen || true
          fi

          {
            echo "### Built: $(ls dist)"
            if [ -s errors.txt ]; then
              echo '### Some features were skipped because they did not compile. Send a screenshot of this box:'
              echo '```'
              cat errors.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
